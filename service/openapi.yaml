openapi: "3.0.3"
info:
  title: Fallernetes Operator API
  version: "1.0.0"
  description: REST API for managing Kubernetes CRDs via the fallernetes operator

paths:
  /server:
    post:
      operationId: CreateServer
      summary: Create a Server CRD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: Server created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServerRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: DeleteServer
      summary: Delete a Server CRD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteObjectRequest'
      responses:
        '204':
          description: Server deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /server/pod/labels:
    post:
      operationId: AddPodLabel
      summary: Add a label to a server pod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPodLabelRequest'
      responses:
        '200':
          description: Label added
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: RemovePodLabel
      summary: Remove a label from a server pod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemovePodLabelRequest'
      responses:
        '204':
          description: Label removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /fleet:
    post:
      operationId: CreateFleet
      summary: Create a Fleet CRD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFleetRequest'
      responses:
        '201':
          description: Fleet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFleetRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: DeleteFleet
      summary: Delete a Fleet CRD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteObjectRequest'
      responses:
        '204':
          description: Fleet deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /fleet/replicas:
    patch:
      operationId: PatchFleetReplicas
      summary: Update replica count on an existing Fleet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchReplicasRequest'
      responses:
        '200':
          description: Replicas updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /game:
    post:
      operationId: CreateGame
      summary: Create a GameType CRD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: GameType created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGameRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: DeleteGame
      summary: Delete a GameType CRD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteObjectRequest'
      responses:
        '204':
          description: GameType deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /game/replicas:
    patch:
      operationId: PatchGameReplicas
      summary: Update replica count on an existing GameType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchReplicasRequest'
      responses:
        '200':
          description: Replicas updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /scaler:
    post:
      operationId: CreateScaler
      summary: Create a GameAutoscaler CRD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScalerRequest'
      responses:
        '201':
          description: GameAutoscaler created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScalerRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: DeleteScaler
      summary: Delete a GameAutoscaler CRD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteObjectRequest'
      responses:
        '204':
          description: GameAutoscaler deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      operationId: Health
      summary: Health check
      responses:
        '200':
          description: Service is healthy

components:
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [ message ]
      properties:
        message:
          type: string
        error:
          type: string

    EnvVar:
      type: object
      required: [ name, value ]
      properties:
        name:
          type: string
        value:
          type: string

    ContainerPort:
      type: object
      required: [ port, protocol ]
      properties:
        port:
          type: integer
          format: int32
        protocol:
          type: string
          enum: [ TCP, UDP ]
        name:
          type: string

    ResourceRequirements:
      type: object
      required: [ cpuRequest, memoryRequest ]
      properties:
        cpuRequest:
          type: string
          example: "100m"
        memoryRequest:
          type: string
          example: "128Mi"
        cpuLimit:
          type: string
        memoryLimit:
          type: string

    SidecarSettings:
      type: object
      required: [ image ]
      properties:
        port:
          type: integer
          format: int32
        image:
          type: string
        logDebug:
          type: boolean

    GameInfo:
      type: object
      properties:
        capacity:
          type: integer
          format: int32

    Container:
      type: object
      required: [ name, image ]
      properties:
        name:
          type: string
        image:
          type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
        ports:
          type: array
          items:
            $ref: '#/components/schemas/ContainerPort'
        resources:
          $ref: '#/components/schemas/ResourceRequirements'

    ServerSpec:
      type: object
      required: [ containers ]
      properties:
        containers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Container'
        initContainers:
          type: array
          items:
            $ref: '#/components/schemas/Container'
        timeout:
          type: string
          description: "Go duration string e.g. 30s"
        allowForceDelete:
          type: boolean
          default: false
        sidecar:
          $ref: '#/components/schemas/SidecarSettings'
        gameInfo:
          $ref: '#/components/schemas/GameInfo'

    FleetScaling:
      type: object
      required: [ replicas ]
      properties:
        replicas:
          type: integer
          format: int32
        prioritizeAllowed:
          type: boolean
        agePriority:
          type: string
          enum: [ oldest_first, newest_first ]

    FleetSpec:
      type: object
      required: [ serverSpec, scaling ]
      properties:
        serverSpec:
          $ref: '#/components/schemas/ServerSpec'
        scaling:
          $ref: '#/components/schemas/FleetScaling'

    GameTypeSpec:
      type: object
      required: [ fleetSpec ]
      properties:
        fleetSpec:
          $ref: '#/components/schemas/FleetSpec'

    WebhookService:
      type: object
      required: [ name, namespace, port ]
      properties:
        name:
          type: string
        namespace:
          type: string
        port:
          type: integer
          format: int32

    WebhookSpec:
      type: object
      required: [ path, service ]
      properties:
        url:
          type: string
        path:
          type: string
        service:
          $ref: '#/components/schemas/WebhookService'

    AutoscalePolicy:
      type: object
      required: [ type, webhook ]
      properties:
        type:
          type: string
          enum: [ webhook ]
        webhook:
          $ref: '#/components/schemas/WebhookSpec'

    Sync:
      type: object
      required: [ type, fixedInterval ]
      properties:
        type:
          type: string
          enum: [ fixedinterval ]
        fixedInterval:
          type: integer
          format: int32

    GameAutoscalerSpec:
      type: object
      required: [ gameTypeName, policy, sync ]
      properties:
        gameTypeName:
          type: string
        policy:
          $ref: '#/components/schemas/AutoscalePolicy'
        sync:
          $ref: '#/components/schemas/Sync'

    CreateServerRequest:
      type: object
      required: [ name, namespace, spec ]
      properties:
        name:
          type: string
        namespace:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        spec:
          $ref: '#/components/schemas/ServerSpec'

    CreateFleetRequest:
      type: object
      required: [ name, namespace, spec ]
      properties:
        name:
          type: string
        namespace:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        spec:
          $ref: '#/components/schemas/FleetSpec'

    CreateGameRequest:
      type: object
      required: [ name, namespace, spec ]
      properties:
        name:
          type: string
        namespace:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        spec:
          $ref: '#/components/schemas/GameTypeSpec'

    CreateScalerRequest:
      type: object
      required: [ name, namespace, spec ]
      properties:
        name:
          type: string
        namespace:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        spec:
          $ref: '#/components/schemas/GameAutoscalerSpec'

    PatchReplicasRequest:
      type: object
      required: [ name, namespace, replicas ]
      properties:
        name:
          type: string
        namespace:
          type: string
        replicas:
          type: integer
          format: int32

    DeleteObjectRequest:
      type: object
      required: [ name, namespace ]
      properties:
        name:
          type: string
        namespace:
          type: string
        force:
          type: boolean
          default: false

    AddPodLabelRequest:
      type: object
      required: [ serverName, namespace, key, value ]
      properties:
        serverName:
          type: string
        namespace:
          type: string
        key:
          type: string
        value:
          type: string

    RemovePodLabelRequest:
      type: object
      required: [ serverName, namespace, key ]
      properties:
        serverName:
          type: string
        namespace:
          type: string
        key:
          type: string
