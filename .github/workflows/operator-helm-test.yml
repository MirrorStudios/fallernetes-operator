name: Operator Chart Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            run-tests:
              - 'operator/internal/**'
              - 'operator/api/**'
              - '.github/workflows/operator-helm-test.yml'
              - 'operator/dist/**'

  test-e2e-helm:
    name: Run Helm Chart Tests
    needs:
      - changes
    runs-on: ubuntu-latest
    env:
      IMG: controller:latest
    steps:
      - name: Check if test should run
        if: needs.changes.outputs.run-tests != 'true'
        run: echo "No relevant changes. Skipping tests."

      - name: Clone the code
        if: needs.changes.outputs.run-tests == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        if: needs.changes.outputs.run-tests == 'true'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: ./operator/go.mod

      - name: Install the latest version of kind
        if: needs.changes.outputs.run-tests == 'true'
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        if: needs.changes.outputs.run-tests == 'true'
        run: kind version

      - name: Create kind cluster
        if: needs.changes.outputs.run-tests == 'true'
        run: kind create cluster

      - name: Prepare operator
        if: needs.changes.outputs.run-tests == 'true'
        working-directory: operator
        run: |
          go mod tidy
          make docker-build
          kind load docker-image $IMG

      - name: Install Helm
        if: needs.changes.outputs.run-tests == 'true'
        working-directory: operator
        run: make install-helm

      - name: Lint Helm Chart
        if: needs.changes.outputs.run-tests == 'true'
        run: |
          helm lint ./operator/dist/chart

      - name: Install cert-manager via Helm (wait for readiness)
        if: needs.changes.outputs.run-tests == 'true'
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 300s

      - name: Deploy manager via Helm
        if: needs.changes.outputs.run-tests == 'true'
        working-directory: operator
        run: make helm-deploy

      - name: Check Helm release status
        if: needs.changes.outputs.run-tests == 'true'
        working-directory: operator
        run: make helm-status